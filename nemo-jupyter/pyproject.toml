[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "nemo-kernel"
version = "0.1.0"
description = "IPython / JupyterLab kernel for the Nemo Datalog language"
requires-python = ">=3.9"
dependencies = [
    "ipykernel>=6",
]

[project.scripts]
nemo-kernel-install = "nemo_kernel.install:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["nemo_kernel*"]

[tool.setuptools.package-data]
nemo_kernel = ["kernel.json"]
