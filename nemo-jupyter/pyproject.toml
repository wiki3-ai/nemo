[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "nemo-jupyter"
version = "0.1.0"
description = "Jupyter kernel and nbconvert exporter for the Nemo rule engine"
requires-python = ">=3.9"
dependencies = ["ipykernel>=6", "jupyter_client>=7", "nmo-python"]

[project.scripts]
nemo-jupyter-install = "nemo_jupyter.install:main"

[project.entry-points."nbconvert.exporters.script"]
nemo = "nemo_jupyter.nbconvert:NemoScriptExporter"

[tool.setuptools]
packages = ["nemo_jupyter", "nemo_jupyter.kernelspec"]

[tool.setuptools.package-data]
"nemo_jupyter.kernelspec" = ["kernel.json"]

# Install the kernelspec automatically so Binder and Jupyter Docker Stacks
# pick up the kernel without requiring a manual `nemo-jupyter-install` step.
[tool.setuptools.data-files]
"share/jupyter/kernels/nemo" = ["nemo_jupyter/kernelspec/kernel.json"]
